# Cloudflare deployment: one Worker serves the built client (dist/) and routes /ws to a
# Durable Object per room. Build first with `npm run build`, then `npx wrangler deploy`.
name = "syn3h"
main = "server/worker.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# /status (how many people are playing, counts only) is answered by the Worker too.
# /ws never matches a file, so it always reaches the Worker; listing it keeps that true even
# if SPA style not found handling is enabled later.
# "/" goes to the Worker so ?v=<version> can serve a frozen build; build.json and models too,
# because their names are not content hashed and a frozen page must get its own copies.
run_worker_first = ["/ws", "/status", "/presence", "/", "/index.html", "/build.json", "/models/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

# SQLite backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Workers Logs: only the room server's own JSON lines (server/log.ts) are kept. Invocation
# logs are off: every Durable Object WebSocket message is an invocation, about 65,000 a
# player-hour. Query strings (they carry room names, which people type) are redacted from
# any request URL that does reach logs or traces.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
invocation_logs = false
