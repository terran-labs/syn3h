# Cloudflare deployment: one Worker serves the built client (dist/) and routes /ws to a
# Durable Object per room. Build first with `npm run build`, then `npx wrangler deploy`.
name = "syn3h"
main = "server/worker.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# /status (how many people are playing, counts only) is answered by the Worker too.
# /ws never matches a file, so it always reaches the Worker; listing it keeps that true even
# if SPA style not found handling is enabled later.
# "/" goes to the Worker so ?v=<version> can serve a frozen build; build.json and models too,
# because their names are not content hashed and a frozen page must get its own copies.
# /webgpu-present-test.html: the default html_handling would answer it with a 307 to the
# extensionless address; the Worker serves the file itself, at its own address (server/worker.ts).
run_worker_first = ["/ws", "/status", "/presence", "/", "/index.html", "/build.json", "/models/*", "/v/*", "/webgpu-present-test.html", "/overflow"]

# Public room overflow (server/registry.ts PublicSeats): when the public room is full, new
# arrivals go to lobby-2, lobby-3 ... Two switches, both off unless someone acts:
#  - PUBLIC_OVERFLOW, the master: "runtime" lets the runtime flag decide; anything else ("off")
#    keeps today's behaviour with no registry call at all. Changing it is a deploy.
#  - The runtime flag, off until set, no deploy needed (POST /overflow, bearer OVERFLOW_TOKEN):
#    curl -X POST -H "Authorization: Bearer $OVERFLOW_TOKEN" -d '{"on":true}' https://<host>/overflow
#    The token is a secret: npx wrangler secret put OVERFLOW_TOKEN. Never commit or log it.
[vars]
PUBLIC_OVERFLOW = "runtime"

# Frozen versions, stored once in R2 (tools/frozen-versions.mjs archive) and read by the Worker for
# every version but its own; deployments carry none. "/v/*" above sends a frozen page's own
# /v/<version>/... addresses to the Worker. The Worker only reads it (server/worker.ts, FrozenBucket).
[[r2_buckets]]
binding = "FROZEN"
bucket_name = "syn3h-versions"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

# SQLite backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# Workers Logs: only the room server's own JSON lines (server/log.ts) are kept. Invocation
# logs are off: every Durable Object WebSocket message is an invocation, about 65,000 a
# player-hour. Query strings (they carry room names, which people type) are redacted from
# any request URL that does reach logs or traces.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
invocation_logs = false
