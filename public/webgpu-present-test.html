<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebGPU present test</title>
<link rel="icon" href="data:,">
<!--
  A standalone WebGPU page that submits each frame's work in the same order as Mira's Medium
  quality path with sun shadows (three.js WebGPURenderer r18x, traced in Chrome on 24 November
  2026). No game code, no files loaded: everything here is generated.

  Per frame, as the game does it:
    1. getCurrentTexture() on the canvas (bgra8unorm or the preferred format, premultiplied alpha,
       usage RENDER_ATTACHMENT | COPY_SRC, toneMapping standard).
    2. Encoder "canvas": begin its render pass on the canvas texture, with a depth24plus depth
       buffer, both clear/store. The pass stays open while 3 to 5 happen.
    3. Encoder "scene": begin its render pass on a 4x multisampled rgba16float target that
       resolves to a single-sample one, with a 4x depth24plus buffer. Also left open.
    4. Per shadow cascade (two by default): writeBuffer, one encoder with one render pass on an
       rgba8unorm colour map and a depth24plus depth map (1024 square), submitted on its own.
    5. writeTexture of a 96x96 rgba8unorm texture.
    6. The scene pass draws (sampling both shadow maps and that texture), ends, and is submitted.
    7. The canvas pass draws the scene's resolved image through a tone map, ends, and is
       submitted last.
  So a frame is four submits, and the canvas texture is held from step 1 to step 7.

  The page behind the canvas is magenta. Every frame drawn here is opaque, so a magenta flash
  is a frame the browser showed with nothing drawn in it.

  Switches (also on the page):
    ?shadows=0|1|2      shadow cascades per frame (default 2, as Medium)
    ?presentHold=1      draw no new frame until onSubmittedWorkDone of the last one resolves
    ?alpha=opaque       configure the canvas opaque instead of premultiplied
    ?samples=1          no multisampling in the scene pass
    ?late=1             the workaround under test: draw the canvas pass into a texture of our own
                        and acquire the canvas texture only at the end, filling it with one copy
                        in its own submit (the canvas texture is then held for one copy only)
    ?fps=30             draw at most one frame every 30 ms (the game's ?frameCap=30)
    ?load=N             fragment work in the scene pass, 0 to 64 (default 12): raise it until the
                        frame rate drops below 60, as the game's does at Medium with shadows
    ?scale=X            canvas pixels per CSS pixel (default the device's, at most 3)
-->
<style>
  html, body { margin: 0; height: 100%; background: #ff00ff; color: #fff; font: 15px/1.35 -apple-system, system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #panel { position: fixed; left: 8px; right: 8px; top: max(8px, env(safe-area-inset-top)); max-width: 560px; margin: 0 auto; padding: 10px 12px; border-radius: 12px; background: rgb(0 0 0 / 0.72); }
  #panel h1 { font-size: 16px; margin: 0 0 4px; }
  #panel p { margin: 4px 0; }
  #count { font: 600 22px/1.2 ui-monospace, Menlo, monospace; margin: 6px 0; }
  #panel label { display: inline-block; margin: 4px 10px 0 0; white-space: nowrap; }
  #panel button { font: inherit; padding: 4px 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #fff8; background: #fff2; color: #fff; }
  #panel.min > :not(.keep) { display: none; }
  #status { color: #ffd479; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1 class="keep">WebGPU present test</h1>
  <div id="count" class="keep">starting</div>
  <p id="status" class="keep"></p>
  <p>Watch the moving picture for 30 seconds. Any flash of <b>magenta</b> is a frame the browser showed with nothing drawn in it. Report one sentence: <i>"frames shown N, magenta flashes seen by eye K, settings S"</i> (N and S are printed above).</p>
  <p>
    <label>Shadow cascades <select id="shadows"><option>0</option><option>1</option><option selected>2</option></select></label>
    <label><input type="checkbox" id="presentHold"> presentHold</label>
    <label><input type="checkbox" id="opaque"> opaque canvas</label>
    <label><input type="checkbox" id="samples1"> 1 sample</label>
    <label><input type="checkbox" id="late"> late acquire</label>
    <label><input type="checkbox" id="fps30"> 30 fps</label>
    <label>Load <input type="number" id="load" min="0" max="64" step="1" style="width:4em"></label>
  </p>
  <button id="apply" type="button">Apply (reloads)</button>
  <button id="flash" type="button" title="Shows one empty frame, so you know what to look for">Show what a flash looks like</button>
  <button id="hide" class="keep" type="button">Hide panel</button>
</div>
<script type="module">
const q = new URLSearchParams(location.search)
const int = (name, def, lo, hi) => { const v = Number.parseInt(q.get(name) ?? '', 10); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : def }
const opt = {
  shadows: int('shadows', 2, 0, 2),
  presentHold: q.get('presentHold') === '1',
  opaque: q.get('alpha') === 'opaque',
  samples: q.get('samples') === '1' ? 1 : 4,
  late: q.get('late') === '1',
  fps30: q.get('fps') === '30',
  load: int('load', 12, 0, 64),
  scale: Math.min(3, Math.max(0.5, Number.parseFloat(q.get('scale') ?? '') || window.devicePixelRatio || 1)),
}
const $ = id => document.getElementById(id)
$('shadows').value = String(opt.shadows); $('presentHold').checked = opt.presentHold; $('opaque').checked = opt.opaque
$('samples1').checked = opt.samples === 1; $('late').checked = opt.late; $('fps30').checked = opt.fps30; $('load').value = String(opt.load)
$('apply').onclick = () => {
  const n = new URLSearchParams()
  if ($('shadows').value !== '2') n.set('shadows', $('shadows').value)
  if ($('presentHold').checked) n.set('presentHold', '1')
  if ($('opaque').checked) n.set('alpha', 'opaque')
  if ($('samples1').checked) n.set('samples', '1')
  if ($('late').checked) n.set('late', '1')
  if ($('fps30').checked) n.set('fps', '30')
  if ($('load').value !== '12') n.set('load', $('load').value)
  if (q.has('scale')) n.set('scale', q.get('scale'))
  location.search = n.toString()
}
$('hide').onclick = () => { const p = $('panel'); p.classList.toggle('min'); $('hide').textContent = p.classList.contains('min') ? 'Show panel' : 'Hide panel' }
const settings = `shadows=${opt.shadows} presentHold=${opt.presentHold ? 1 : 0} alpha=${opt.opaque ? 'opaque' : 'premultiplied'} samples=${opt.samples} late=${opt.late ? 1 : 0} fps=${opt.fps30 ? 30 : 'any'} load=${opt.load} scale=${opt.scale}`
const fail = text => { $('count').textContent = 'not running'; $('status').textContent = text; window.__presentTest = { error: text } }

async function main() {
  if (!navigator.gpu) return fail('This browser has no WebGPU (navigator.gpu is missing).')
  const adapter = await navigator.gpu.requestAdapter()
  if (!adapter) return fail('No WebGPU adapter.')
  const device = await adapter.requestDevice()
  device.lost.then(info => fail(`WebGPU device lost: ${info.reason} ${info.message}`))
  device.onuncapturederror = e => { $('status').textContent = 'WebGPU error: ' + e.error.message; console.error(e.error.message) }
  const canvas = $('c'), context = canvas.getContext('webgpu')
  const format = navigator.gpu.getPreferredCanvasFormat()
  let usage = GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC
  if (opt.late) usage |= GPUTextureUsage.COPY_DST
  const configure = () => context.configure({ device, format, alphaMode: opt.opaque ? 'opaque' : 'premultiplied', usage, toneMapping: { mode: 'standard' } })

  // ---- Shaders: generated geometry, no vertex buffers.
  const common = /* wgsl */`
    struct U { time: f32, cascade: f32, load: f32, aspect: f32 }
    @group(0) @binding(0) var<uniform> u: U;
    fn hash(n: f32) -> f32 { return fract(sin(n) * 43758.5453); }
    // Triangle i of a field of small spinning triangles, 3 vertices each.
    fn field(vi: u32, spread: f32) -> vec4f {
      let t = f32(vi / 3u); let k = f32(vi % 3u);
      let a = u.time * (0.3 + hash(t) * 0.7) + k * 2.094;
      let c = vec2f(hash(t * 1.7) * 2.0 - 1.0, hash(t * 3.1) * 2.0 - 1.0) * spread;
      return vec4f(c + vec2f(cos(a), sin(a)) * 0.06, 0.2 + hash(t * 5.3) * 0.6, 1.0);
    }`
  const shadowModule = device.createShaderModule({ code: common + /* wgsl */`
    @vertex fn vs(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f { return field(vi, 1.0 - u.cascade * 0.4); }
    @fragment fn fs() -> @location(0) vec4f { return vec4f(1.0, 0.9, 0.8, 1.0); }` })
  const sceneModule = device.createShaderModule({ code: common + /* wgsl */`
    @group(0) @binding(1) var shadowColor0: texture_2d<f32>;
    @group(0) @binding(2) var shadowDepth0: texture_depth_2d;
    @group(0) @binding(3) var shadowColor1: texture_2d<f32>;
    @group(0) @binding(4) var shadowDepth1: texture_depth_2d;
    @group(0) @binding(5) var noise: texture_2d<f32>;
    @group(0) @binding(6) var linearSampler: sampler;
    @group(0) @binding(7) var compareSampler: sampler_comparison;
    struct V { @builtin(position) p: vec4f, @location(0) uv: vec2f }
    @vertex fn vs(@builtin(vertex_index) vi: u32) -> V {
      // A full-screen triangle first, then a field of triangles over it.
      if (vi < 3u) { let xy = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u)) * 2.0 - 1.0; return V(vec4f(xy, 0.99, 1.0), xy * 0.5 + 0.5); }
      let p = field(vi - 3u, 1.0); return V(p, p.xy * 0.5 + 0.5);
    }
    @fragment fn fs(v: V) -> @location(0) vec4f {
      var lit = 0.0;
      for (var i = 0; i < 9; i++) {
        let o = vec2f(f32(i % 3) - 1.0, f32(i / 3) - 1.0) / 1024.0;
        lit += textureSampleCompare(shadowDepth0, compareSampler, v.uv + o, 0.5);
        lit += textureSampleCompare(shadowDepth1, compareSampler, v.uv * 0.5 + o, 0.5);
      }
      var c = vec3f(0.08, 0.12, 0.2) + vec3f(0.9, 0.7, 0.4) * (lit / 18.0);
      c += textureSample(shadowColor0, linearSampler, v.uv).rgb * 0.1 + textureSample(shadowColor1, linearSampler, v.uv).rgb * 0.05;
      c *= 0.8 + 0.4 * textureSample(noise, linearSampler, v.uv * 4.0).r;
      // Adjustable fragment cost, like the game's lighting: a few dozen to a few hundred ALU ops.
      var w = v.uv;
      for (var j = 0; j < i32(u.load); j++) { w = fract(w * 1.37 + vec2f(sin(w.y * 9.0 + u.time), cos(w.x * 7.0))); }
      c += vec3f(w * 0.04, 0.0);
      return vec4f(c * 0.8, 1.0);
    }` })
  const outputModule = device.createShaderModule({ code: /* wgsl */`
    @group(0) @binding(0) var image: texture_2d<f32>;
    @group(0) @binding(1) var s: sampler;
    struct V { @builtin(position) p: vec4f, @location(0) uv: vec2f }
    @vertex fn vs(@builtin(vertex_index) vi: u32) -> V { let xy = vec2f(f32((vi << 1u) & 2u), f32(vi & 2u)) * 2.0 - 1.0; return V(vec4f(xy, 0.0, 1.0), vec2f(xy.x * 0.5 + 0.5, 0.5 - xy.y * 0.5)); }
    @fragment fn fs(v: V) -> @location(0) vec4f {
      let x = textureSample(image, s, v.uv).rgb;
      // ACES filmic (Narkowicz), as the game tone maps, then opaque.
      let m = clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), vec3f(0.0), vec3f(1.0));
      return vec4f(pow(m, vec3f(1.0 / 2.2)), 1.0);
    }` })

  const shadowPipeline = device.createRenderPipeline({ label: 'shadow', layout: 'auto',
    vertex: { module: shadowModule, entryPoint: 'vs' }, fragment: { module: shadowModule, entryPoint: 'fs', targets: [{ format: 'rgba8unorm' }] },
    depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' } })
  const scenePipeline = device.createRenderPipeline({ label: 'scene', layout: 'auto',
    vertex: { module: sceneModule, entryPoint: 'vs' }, fragment: { module: sceneModule, entryPoint: 'fs', targets: [{ format: 'rgba16float' }] },
    depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less-equal' }, multisample: { count: opt.samples } })
  const outputPipeline = device.createRenderPipeline({ label: 'output', layout: 'auto',
    vertex: { module: outputModule, entryPoint: 'vs' }, fragment: { module: outputModule, entryPoint: 'fs', targets: [{ format }] },
    depthStencil: { format: 'depth24plus', depthWriteEnabled: false, depthCompare: 'always' } })

  const tex = (label, w, h, fmt, use, samples = 1) => device.createTexture({ label, size: [w, h], format: fmt, usage: use, sampleCount: samples })
  const RA = GPUTextureUsage.RENDER_ATTACHMENT, TB = GPUTextureUsage.TEXTURE_BINDING
  const shadowMaps = [0, 1].map(i => ({ color: tex(`ShadowMap${i}`, 1024, 1024, 'rgba8unorm', RA | TB), depth: tex(`ShadowDepth${i}`, 1024, 1024, 'depth24plus', RA | TB) }))
  const noise = tex('noise', 96, 96, 'rgba8unorm', TB | GPUTextureUsage.COPY_DST)
  const noiseBytes = new Uint8Array(96 * 96 * 4)
  const uniforms = [0, 1, 2].map(() => device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST }))
  const linear = device.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'repeat', addressModeV: 'repeat' })
  const compare = device.createSampler({ compare: 'less', magFilter: 'linear', minFilter: 'linear' })
  const shadowGroups = [0, 1].map(i => device.createBindGroup({ layout: shadowPipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: uniforms[i] } }] }))

  // Size-dependent targets, remade on resize (never during a frame).
  let size = [0, 0], target
  const fit = () => {
    const w = Math.max(1, Math.round(canvas.clientWidth * opt.scale)), h = Math.max(1, Math.round(canvas.clientHeight * opt.scale))
    if (w === size[0] && h === size[1]) return
    size = [w, h]; canvas.width = w; canvas.height = h; configure()
    target?.destroy()
    const msaa = opt.samples > 1 ? tex('output-msaa', w, h, 'rgba16float', RA, opt.samples) : null
    const output = tex('output', w, h, 'rgba16float', RA | TB)
    target = {
      msaa, output, depth: tex('depth', w, h, 'depth24plus', RA, opt.samples), canvasDepth: tex('depthBuffer', w, h, 'depth24plus', RA),
      own: opt.late ? tex('late-frame', w, h, format, RA | GPUTextureUsage.COPY_SRC) : null,
      scene: device.createBindGroup({ layout: scenePipeline.getBindGroupLayout(0), entries: [
        { binding: 0, resource: { buffer: uniforms[2] } },
        { binding: 1, resource: shadowMaps[0].color.createView() }, { binding: 2, resource: shadowMaps[0].depth.createView() },
        { binding: 3, resource: shadowMaps[1].color.createView() }, { binding: 4, resource: shadowMaps[1].depth.createView() },
        { binding: 5, resource: noise.createView() }, { binding: 6, resource: linear }, { binding: 7, resource: compare }] }),
      outputGroup: device.createBindGroup({ layout: outputPipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: output.createView() }, { binding: 1, resource: linear }] }),
      destroy() { for (const t of [this.msaa, this.output, this.depth, this.canvasDepth, this.own]) t?.destroy() },
    }
  }
  window.addEventListener('resize', () => { pendingFit = true })
  let pendingFit = true

  let lastDrawn = -Infinity, frames = 0, held = 0, busy = false, flashNext = false, last = performance.now(), fpsFrames = 0, fps = 0
  $('flash').onclick = () => { flashNext = true }
  const u32 = new Float32Array(4)
  const frame = now => {
    requestAnimationFrame(frame)
    if (opt.presentHold && busy) { held++; return }
    if (opt.fps30 && now - lastDrawn < 30) return
    lastDrawn = now
    if (pendingFit) { pendingFit = false; fit() }
    const t = now / 1000, [w, h] = size
    const showEmpty = flashNext; flashNext = false

    // 1. The canvas texture, at the start of the frame (unless late acquire).
    const canvasView = opt.late ? target.own.createView() : context.getCurrentTexture().createView()
    // 2. The canvas pass, begun now and left open.
    const canvasEncoder = device.createCommandEncoder({ label: 'canvas' })
    const canvasPass = canvasEncoder.beginRenderPass({ label: 'canvas',
      colorAttachments: [{ view: canvasView, loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, showEmpty ? 0 : 1] }],
      depthStencilAttachment: { view: target.canvasDepth.createView(), depthLoadOp: 'clear', depthStoreOp: 'store', depthClearValue: 1 } })
    // 3. The scene pass, begun now and left open.
    const sceneEncoder = device.createCommandEncoder({ label: 'scene' })
    const scenePass = sceneEncoder.beginRenderPass({ label: 'scene',
      colorAttachments: [target.msaa ? { view: target.msaa.createView(), resolveTarget: target.output.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }
        : { view: target.output.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }],
      depthStencilAttachment: { view: target.depth.createView(), depthLoadOp: 'clear', depthStoreOp: 'store', depthClearValue: 1 } })
    // 4. Each shadow cascade: its own encoder, pass and submit.
    for (let i = 0; i < opt.shadows; i++) {
      u32.set([t, i, 0, w / h]); device.queue.writeBuffer(uniforms[i], 0, u32)
      const e = device.createCommandEncoder({ label: `shadow ${i}` })
      const p = e.beginRenderPass({ label: `shadow ${i}`,
        colorAttachments: [{ view: shadowMaps[i].color.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 0] }],
        depthStencilAttachment: { view: shadowMaps[i].depth.createView(), depthLoadOp: 'clear', depthStoreOp: 'store', depthClearValue: 1 } })
      p.setPipeline(shadowPipeline); p.setBindGroup(0, shadowGroups[i]); p.draw(3 * 4000); p.end()
      device.queue.submit([e.finish()])
    }
    // 5. A small texture written every frame.
    for (let i = 0; i < noiseBytes.length; i += 4) noiseBytes[i] = (i * 2654435761 + frames * 97) >>> 24
    device.queue.writeTexture({ texture: noise }, noiseBytes, { bytesPerRow: 96 * 4 }, [96, 96])
    // 6. The scene: draw, end, submit.
    u32.set([t, 0, opt.load, w / h]); device.queue.writeBuffer(uniforms[2], 0, u32)
    scenePass.setPipeline(scenePipeline); scenePass.setBindGroup(0, target.scene); scenePass.draw(3 + 3 * 2000); scenePass.end()
    device.queue.submit([sceneEncoder.finish()])
    // 7. The canvas: tone-mapped scene, end, submit last.
    if (!showEmpty) { canvasPass.setPipeline(outputPipeline); canvasPass.setBindGroup(0, target.outputGroup); canvasPass.draw(3) }
    canvasPass.end()
    device.queue.submit([canvasEncoder.finish()])
    if (opt.late) {
      // The canvas texture only now, filled by one copy in a submit of its own.
      const copy = device.createCommandEncoder({ label: 'late copy' })
      copy.copyTextureToTexture({ texture: target.own }, { texture: context.getCurrentTexture() }, [w, h])
      device.queue.submit([copy.finish()])
    }
    if (opt.presentHold) { busy = true; device.queue.onSubmittedWorkDone().then(() => { busy = false }) }

    frames++; fpsFrames++
    if (now - last >= 500) { fps = fpsFrames * 1000 / (now - last); fpsFrames = 0; last = now }
    $('count').textContent = `frames shown ${frames} · ${fps.toFixed(0)} fps` + (opt.presentHold ? ` · held ${held}` : '')
    $('status').textContent = `${settings} · ${w}x${h} ${format}`
    window.__presentTest = { frames, held, fps, settings, size: [w, h], format }
  }
  requestAnimationFrame(frame)
}
main().catch(e => fail(String(e?.message ?? e)))
</script>
</body>
</html>
