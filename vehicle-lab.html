<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Syn3h vehicle lab</title><link rel="icon" href="data:,">
<!-- Developer tool: see docs/vehicle-lab.md. Not part of the production build (vite builds index.html only). -->
<style>
html,body{height:100%}
body{margin:0;background:#8d9096;color:#f2f5f8;font:15px/1.35 system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
#top{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));pointer-events:none;text-shadow:0 1px 3px #000a,0 0 10px #0008}
h1{font-size:19px;margin:0 0 2px}#hint{margin:0;font-size:13px;opacity:.9}
#card{position:absolute;left:calc(16px + env(safe-area-inset-left));top:calc(70px + env(safe-area-inset-top));max-width:340px;background:rgba(16,18,22,.74);border:1px solid #ffffff2a;border-radius:9px;padding:10px 14px;pointer-events:none}
#name{font-size:17px}#group{font-size:12px;opacity:.7}
#notes{margin:6px 0 0;padding-left:18px;color:#d3dae2;font-size:13.5px}
#stats{margin:8px 0 0;font:12.5px/1.4 ui-monospace,Menlo,monospace;color:#9fe0b8;white-space:pre-wrap}
#status{position:absolute;left:0;right:0;top:45%;text-align:center;font-size:17px;text-shadow:0 1px 4px #000}
#bar{position:absolute;left:0;right:0;bottom:0;padding:10px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:8px;align-items:center;background:linear-gradient(#0000,#000a 35%)}
#tabs,.panel{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.panel{display:none}.panel.open{display:flex}
#tabs button{background:#0000;border-color:#ffffff40}
#tabs button[aria-pressed=true]{background:#ffffff26;border-color:#fff;color:#fff}
button,.picker,.slider{min-height:44px;min-width:44px;box-sizing:border-box;padding:9px 14px;color:#fff;background:#1d2026d9;border:1px solid #ffffff3a;border-radius:9px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button[aria-pressed=true]{background:#fff;color:#111;border-color:#fff}
button[hidden]{display:none}
.swatch{width:44px;padding:0;border-radius:50%;border:2px solid #fff8}
.swatch[aria-pressed=true]{border:3px solid #fff;outline:2px solid #000}
.picker input{width:34px;height:26px;border:0;padding:0;background:none}
.slider input{width:120px}
/* Roomy screens (iPad landscape, desktop) show every panel at once; narrow ones use the tabs. */
@media (min-width:1000px) and (min-height:600px){#tabs{display:none}.panel{display:flex}#bar{gap:6px}}
/* Phones: a compact card under the title; tap it to show the notes. */
#more{display:none;font-size:12px;opacity:.7;margin-top:2px}
@media (max-width:640px){#card{top:calc(44px + env(safe-area-inset-top));left:10px;right:10px;max-width:none;padding:8px 12px;pointer-events:auto;cursor:pointer}#card:not(.expanded) #notes{display:none}#more{display:block}#card.expanded #more{display:none}#notes{font-size:12.5px}#hint{display:none}h1{font-size:16px}#tabs{gap:6px}#tabs button{padding:8px 10px}}
@media (max-height:500px){#card{max-width:260px}#notes{display:none}#hint{display:none}}
/* In the cockpit only the camera buttons stay, so the bar does not hide the view ahead. */
body.inside #tabs,body.inside .panel{display:none}body.inside .panel[data-name=Camera]{display:flex}body.inside #card{display:none}
body.still #top,body.still #card,body.still #bar,body.still #status{display:none}
</style></head><body>
<div id="top"><h1 id="title">Syn3h vehicle lab</h1><p id="hint">Drag to orbit, pinch or scroll to zoom.</p></div>
<div id="card"><strong id="name"></strong><div id="group"></div><ul id="notes"></ul><div id="stats"></div><div id="more">Tap for notes</div></div>
<div id="status">Loading…</div>
<div id="bar"><div id="tabs"></div></div>
<script type="module" src="/src/dev/vehicleLab/lab.ts"></script></body></html>
