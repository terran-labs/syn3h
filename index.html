<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The page never zooms: it is a game with controls fixed to the screen edges, and a zoomed
         page puts them out of reach. See the "never zoom" script and styles below. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Mira | Your galaxy awaits.</title>
    <meta name="description" content="Drive, fly and explore alien worlds together in your browser. Mira, from the creator of Mars Explorer." />
    <meta name="theme-color" content="#01020a" />
    <!-- The name under a home-screen pin on iOS, which otherwise takes the whole title. -->
    <meta name="apple-mobile-web-app-title" content="Mira" />
    <!-- Card crawlers do not run scripts and need full addresses: this is the public release address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mira" />
    <meta property="og:title" content="Mira | Your galaxy awaits." />
    <meta property="og:description" content="Drive, fly and explore alien worlds together. From the creator of Mars Explorer." />
    <meta property="og:url" content="https://mira.cc/" />
    <meta property="og:image" content="https://mira.cc/brand/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Mira logo, a black silhouette in a gold glow, over a dark starfield, above the words Your galaxy awaits." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mira | Your galaxy awaits." />
    <meta name="twitter:description" content="Drive, fly and explore alien worlds together. From the creator of Mars Explorer." />
    <meta name="twitter:image" content="https://mira.cc/brand/share-card.png" />
    <meta name="twitter:image:alt" content="The Mira logo, a black silhouette in a gold glow, over a dark starfield, above the words Your galaxy awaits." />
    <link rel="manifest" href="/brand/mira3-manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/mira3-apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/brand/mira3-favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #01020a; color: #e8e6e3;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
      #hud { position: fixed; left: 12px; bottom: 10px; pointer-events: none; text-shadow: 0 1px 2px #000; white-space: pre; }
      /* Never zoom, part 1: no double-tap zoom anywhere (manipulation allows only panning
         and, where the viewport permits it, pinching, which the script below also stops), no
         text inflation, no rubber-band scrolling of the page itself. */
      html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overscroll-behavior: none; }
      /* Never select, part 1. This is a game, not a document: a long press or a drag must
         never select text, open the copy and look-up callout, show the magnifier, flash a tap
         highlight or drag an image. Fields the player types in are the only exception. */
      html, body, body * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      img, svg, a, canvas { -webkit-user-drag: none; user-drag: none; }
      input, textarea, [contenteditable], [contenteditable] * { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
      /* Never zoom, part 2: Safari on iPhone and iPad zooms the page when a field with type
         smaller than 16px is focused. On touch screens every field is at least that. */
      @media (pointer: coarse) { input, select, textarea { font-size: max(16px, 1em) !important; } }
      #fatal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; text-align: center; }

      /* ---- The loading veil, brought over verbatim from terranlabs.com (src/index.css,
         BootGate.tsx, lib/boot.ts, and the bootstrap script in its layout). It is in the
         page itself, not the bundle, so it covers the very first paint. These three
         variables are the only thing it reads from a theme. One change: the failsafe that
         lifts the veil if no script ever arrives waits 60 seconds, not 12, because a
         phone can take that long to build a world. */
      :root { --theme-bg-root: #01020a; --theme-text-primary: #f7f9fd; --theme-heading-accent: #2997ff; }
      /* The loading veil (lib/boot.ts, BootGate.tsx): the theme's own space
         colour and a small mark, over everything, until the first screen's fonts
         and scene are ready. Then the mark opens out, the veil fades and the page
         shows through, all at once and never piece by piece. It is only displayed
         once the layout's bootstrap script has marked the document. */
      .boot-veil {
        display: none;
      }

      html[data-boot] .boot-veil {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        /* The same colour as the page behind it. On the home page that is the
           scene's space colour, because the bootstrap script has already put the
           Planetfall class on <html>; it used to arrive with the framework, and
           the veil sat in the theme's plain grey until then. */
        /* A one-colour gradient, not a background-color: see .site-menu-sheet. */
        background-image: linear-gradient(var(--theme-bg-root), var(--theme-bg-root));
        opacity: 1;
        transition:
          opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0s linear 0.9s;
        /* If the script never arrives to lift it, it lifts itself. */
        animation: boot-veil-failsafe 0.9s ease 60s forwards;
      }

      html[data-boot="done"] .boot-veil {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes boot-veil-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      /* The mark: a dark world seen edge on. A hairline ring is its limb; light
         travels round the limb as the page loads, led by a small sun, and has
         gone all the way round when everything is ready. A moon keeps a slow
         outer orbit, so the mark is alive even while a slow connection holds the
         light still. --boot-progress (0 to 1) is set by the bootstrap script in
         the layout and raised by BootGate. */
      .boot-mark {
        width: 5.5rem;
        height: 5.5rem;
        overflow: visible;
        opacity: 0;
        /* It waits a moment, so a fast load is a plain fade with no flicker. */
        animation: boot-mark-in 0.5s ease 0.2s forwards;
        transition:
          transform 0.9s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.9s ease;
      }

      .boot-mark circle {
        fill: none;
        vector-effect: non-scaling-stroke;
      }

      .boot-ring {
        stroke: color-mix(in srgb, var(--theme-text-primary) 13%, transparent);
        stroke-width: 1;
      }

      .boot-arc {
        stroke: var(--theme-heading-accent, var(--theme-text-primary));
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-dasharray: 100;
        stroke-dashoffset: calc(100 - var(--boot-progress, 0) * 100);
        transform: rotate(-90deg);
        transform-origin: 60px 60px;
        filter: drop-shadow(0 0 5px color-mix(in srgb, var(--theme-heading-accent, #fff) 70%, transparent));
      }

      .boot-sun {
        transform: rotate(calc(var(--boot-progress, 0) * 360deg));
        transform-origin: 60px 60px;
      }

      .boot-mark .boot-sun circle {
        fill: var(--theme-text-primary);
        filter: drop-shadow(0 0 6px var(--theme-heading-accent, #fff));
      }

      .boot-orbit {
        stroke: color-mix(in srgb, var(--theme-text-primary) 9%, transparent);
        stroke-width: 1;
        stroke-dasharray: 0.6 5.4;
      }

      .boot-moon {
        transform-origin: 60px 60px;
        animation: boot-orbit 14s linear infinite;
      }

      .boot-mark .boot-moon circle {
        fill: color-mix(in srgb, var(--theme-text-primary) 55%, transparent);
      }

      /* Ready: the mark opens outward and dissolves with the veil. Its orbit
         stops, since an animation running unseen forever is wasted work. */
      html[data-boot="done"] .boot-mark {
        transform: scale(1.6);
        filter: blur(3px);
      }

      html[data-boot="done"] .boot-moon {
        animation-play-state: paused;
      }

      @keyframes boot-orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes boot-mark-in {
        to {
          opacity: 1;
        }
      }

      /* ---- Mira's additions to the veil. The mark above is terranlabs.com's; on a phone,
         over a slow link, a small dim ring alone read as a blank screen (the owner's iPad,
         14 November 2026). So: the name, a larger and brighter mark, a word of status that
         changes with each loading phase, and after eight seconds a line that says it is
         still working. All of it is here in the page, so it shows before any script. */
      html[data-boot] .boot-veil { grid-template-rows: 1fr auto auto auto auto 1.2fr; justify-items: center; gap: 0; padding: 24px; text-align: center; }
      .boot-mark { grid-row: 3; width: 116px; height: 116px; animation-delay: 0s; }
      .boot-ring { stroke: color-mix(in srgb, var(--theme-text-primary) 30%, transparent); stroke-width: 1.5; }
      .boot-arc { stroke-width: 3; }
      .boot-orbit { stroke: color-mix(in srgb, var(--theme-text-primary) 22%, transparent); }
      .boot-status, .boot-still { margin: 0; color: var(--theme-text-primary); font: 500 17px/1.4 Barlow, "Avenir Next", "Segoe UI", system-ui, sans-serif; }
      /* The status line is a dry joke about what is loading, rotated by LoadingScreen. Two
         lines of height are reserved so a long one never moves the rest of the veil, and the
         cross-fade is on opacity only. Screen readers hear the plain phase from LoadingScreen's
         own live region instead, so this line is aria-hidden. */
      .boot-status { grid-row: 4; margin-top: 20px; letter-spacing: 0.02em; min-height: 2.8em; max-width: 26em; text-wrap: balance; opacity: 0; transition: opacity 0.4s ease; }
      /* Hidden for eight seconds, then it fades in by itself: no script needed. */
      /* After ten seconds, a plain line under the fun one: seconds so far and what is really
         happening (the veil's script below, and src/ui/LoadingScreen.ts). No joke on it. */
      /* The progress line: after three seconds still loading, the seconds and the megabytes
         received (the script below), in tabular figures so it does not jitter. Its space is held
         from the start, so nothing above it moves when it fades in. */
      .boot-still { grid-row: 5; margin-top: 8px; min-height: 1.4em; font-size: 14px; font-weight: 400; color: color-mix(in srgb, var(--theme-text-primary) 62%, transparent); opacity: 0; font-variant-numeric: tabular-nums; transition: opacity 0.4s ease; }
      /* Both lines, the fun one and the progress line, appear together, from one trigger: three
         seconds into a load still going (html[data-boot-late], set by the script below). A load
         that ends sooner shows only the point of light. Their space is held throughout. */
      html[data-boot-late] .boot-status, html[data-boot-late] .boot-still { opacity: 1; }
      @media (prefers-reduced-motion: reduce) { .boot-status, .boot-still { transition: none; } }
      /* The progress bar (with the build's startup total, html[data-boot-bytes]): a hairline in the
         pale metal of the lobby's name, in the progress line's place and held space, so nothing
         moves when it appears. Its fill is --boot-bar, set every frame by the head's bootstrap (in
         steps under reduced motion). ?bootpct=1 adds the percentage beside it. */
      html[data-boot-bytes] .boot-still { display: flex; align-items: center; justify-content: center; gap: 10px; }
      .boot-bar { display: block; width: min(220px, 56vw); height: 2px; border-radius: 1px; overflow: hidden; background: rgb(243 233 214 / 0.16); }
      .boot-bar::after { content: ""; display: block; height: 100%; transform-origin: 0 50%; transform: scaleX(var(--boot-bar, 0)); background: linear-gradient(90deg, #cdbb94, #f3e9d6 70%, #fffaf0); box-shadow: 0 0 6px rgb(255 240 214 / 0.5); }
      .boot-pct { display: none; min-width: 4ch; text-align: right; font-size: 13px; }
      html[data-boot-percent] .boot-pct { display: inline; }
      /* The physics engine's download is being retried (src/core/physicsWasm.ts): the status
         line says so, and the veil stays up while it does, so its failsafe is off. After the last
         try the message replaces the numbers and a Try again button sits under it. It fades in; nothing slides. */
      html[data-boot-retry] .boot-veil { animation: none; }
      /* Given up: the seconds and megabytes no longer mean anything, and the longer message takes their place. */
      html[data-boot-retry="failed"] .boot-still { visibility: hidden; }
      .boot-retry { grid-row: 6; align-self: start; margin-top: 20px; padding: 10px 22px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--theme-text-primary) 40%, transparent); background: color-mix(in srgb, var(--theme-text-primary) 10%, transparent); color: var(--theme-text-primary); font: 500 16px/1.2 Barlow, "Avenir Next", "Segoe UI", system-ui, sans-serif; cursor: pointer; animation: boot-retry-in 0.4s ease both; }
      .boot-retry:focus-visible { outline: 2px solid var(--theme-heading-accent); outline-offset: 3px; }
      html[data-intro] .boot-retry { position: fixed; left: 50%; top: calc(var(--boot-under) + 5.6em); translate: -50% 0; margin: 0; }
      @keyframes boot-retry-in { from { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .boot-retry { animation: none; } }
      /* A room move (src/ui/parallelUniverse.ts, a full room's parallel universe and the moves
         between rooms): from the navigation until the game is on screen the veil stays up, whatever
         data-boot says and in every motion setting, so the lobby never shows between, and its status
         line says what is happening. Removing the attribute lets the veil fade as usual. */
      html[data-room-move] .boot-veil { opacity: 1 !important; visibility: visible !important; pointer-events: auto !important; animation: none !important; }
      html[data-room-move] .boot-status, html[data-room-move] .boot-still { opacity: 1 !important; }
      /* Until the move's line is in it (index.html's own markup carries a general loading line). */
      html[data-move-unsaid] .boot-status { visibility: hidden !important; }
      html[data-boot="done"] .boot-status, html[data-boot="done"] .boot-still { transition: opacity 0.4s ease; opacity: 0; animation: none; }
      /* ---- The continuous opening (?intro=, src/ui/galaxy/opening.ts). The veil is black
         space and one point of light at the very centre, where the lobby's sun is drawn at
         its opening framing on every screen. The point is the progress: it brightens and
         swells as loading goes on. When loading ends the veil goes in 0.3 s and the galaxy,
         drawing the same point beneath it, makes it the sun. The name waits for the reveal
         (intro 1 and 2) or stays on the veil as today (3). */
      /* Where the point sits: exactly where the galaxy draws its sun on the opening's first frame,
         so the Big Bang leaves from the point (the owner, 18 November 2026). The galaxy publishes
         that place as --sun-x and --sun-y on <html> while the opening waits (Galaxy.ts,
         publishSun), following any resize or rotation; before its first frame the default here
         is its own framing (FRAME_Y: 53% down). --boot-ring-r is the pulse rings' largest radius:
         the lines under the point start that far below it, plus a margin, so no ring crosses them. */
      :root { --boot-ring-r: 60px; --boot-under: calc(var(--sun-y, 53%) + var(--boot-ring-r) + 18px); }
      .boot-point, .boot-pulse { display: none; }
      html[data-intro] .boot-mark { display: none; }
      html[data-intro] .boot-point {
        display: block; position: fixed; left: var(--sun-x, 50%); top: var(--sun-y, 53%); width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%;
        /* Gathering: from a faint speck to a bright point with a warm glow, plainly growing. */
        background: #fffaf0; opacity: calc(0.65 + var(--boot-progress, 0) * 0.35);
        transform: scale(calc(0.8 + var(--boot-progress, 0) * 1.1));
        box-shadow: 0 0 calc(2px + var(--boot-progress, 0) * 9px) calc(var(--boot-progress, 0) * 2.5px) rgb(255 236 205 / calc(0.4 + var(--boot-progress, 0) * 0.5)), 0 0 calc(6px + var(--boot-progress, 0) * 34px) rgb(255 196 128 / calc(0.05 + var(--boot-progress, 0) * 0.4));
      }
      /* Waiting for the Big Bang: the point breathes, eager to pop. A squash-and-stretch with a
         little wobble and a faint ring puffing off each beat, every 1.8 s, from the first paint.
         The breath is on the separate scale and rotate properties, so it multiplies the progress
         size above (transform): the point still grows as loading goes on. */
      html[data-intro] .boot-point { animation: boot-breath 1.8s cubic-bezier(.45,0,.55,1) infinite; }
      /* The ring puffing off each beat. Drawn at its largest size and only ever scaled down, so
         it is rasterized at the screen's full resolution: a small ring scaled up seven times
         showed its pixels (the owner, 18 November 2026). The outer box follows loading as the
         point does; the inner one is the beat. Both scale at most 1. */
      html[data-intro] .boot-pulse {
        display: block; position: fixed; left: var(--sun-x, 50%); top: var(--sun-y, 53%); width: calc(var(--boot-ring-r) * 2); height: calc(var(--boot-ring-r) * 2);
        margin: calc(var(--boot-ring-r) * -1) 0 0 calc(var(--boot-ring-r) * -1); pointer-events: none;
        transform: scale(calc((0.8 + var(--boot-progress, 0) * 1.1) / 1.9));
      }
      html[data-intro] .boot-pulse::after {
        content: ""; position: absolute; inset: 0; border-radius: 50%; box-sizing: border-box; border: 6px solid rgb(255 214 160 / .7);
        opacity: 0; transform: scale(0.143); animation: boot-puff 1.8s cubic-bezier(.2,.6,.3,1) infinite; will-change: transform, opacity;
      }
      @keyframes boot-breath {
        0%, 100% { scale: 1 1; rotate: 0deg; filter: brightness(1); }
        38% { scale: 1.45 1.45; rotate: 0deg; filter: brightness(1.6); }
        48% { scale: 1.6 1.2; rotate: -7deg; filter: brightness(1.7); }
        58% { scale: 1.2 1.6; rotate: 6deg; }
        70% { scale: 1.1 1.0; rotate: -2deg; filter: brightness(1.2); }
      }
      @keyframes boot-puff {
        0%, 40% { transform: scale(0.143); opacity: 0; }
        45% { opacity: .75; }
        100% { transform: scale(1); opacity: 0; }
      }
      /* Reduced motion still shows it is working: a breath of brightness and glow only. */
      @media (prefers-reduced-motion: reduce) {
        html[data-intro] .boot-point { animation: boot-glow 1.8s ease-in-out infinite; }
        html[data-intro] .boot-pulse::after { animation: none; }
      }
      @keyframes boot-glow { 0%, 100% { filter: brightness(0.7) drop-shadow(0 0 2px rgb(255 214 160 / .3)); } 50% { filter: brightness(1.7) drop-shadow(0 0 10px rgb(255 214 160 / .9)); } }
      /* Loading done: the breath stops at rest, so the galaxy's point beneath takes over without a jump. */
      html[data-intro][data-boot="done"] .boot-point { animation: none; scale: 1; rotate: 0deg; filter: none; }
      html[data-intro][data-boot="done"] .boot-pulse::after { animation: none; opacity: 0; }
      html[data-intro] .boot-status { position: fixed; left: 0; right: 0; top: var(--boot-under); margin: 0 auto; padding: 0 var(--edge, 24px); }
      html[data-intro] .boot-still { position: fixed; left: 0; right: 0; top: calc(var(--boot-under) + 3.3em); }
      html[data-intro][data-boot="done"] .boot-veil { transition: opacity 0.3s ease, visibility 0s linear 0.3s; }
      /* ---- Tap to begin (src/ui/TapToBegin.ts). Where sound is blocked, the veil stays up
         after loading (data-boot="ready"): the point keeps breathing, the loading lines go,
         and one line saying a tap begins takes their place. The whole screen is the button. */
      html[data-boot="ready"] .boot-status, html[data-boot="ready"] .boot-still { transition: opacity 0.3s ease; opacity: 0; }
      .tap-gate {
        position: fixed; inset: 0; z-index: 1001; display: block; width: 100%; height: 100%; margin: 0; padding: 0;
        border: 0; border-radius: 0; background: transparent; color: var(--theme-text-primary);
        font: 500 17px/1.4 Barlow, "Avenir Next", "Segoe UI", system-ui, sans-serif; letter-spacing: 0.02em;
        cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; outline: none;
      }
      .tap-gate-line {
        position: absolute; left: 0; right: 0; top: var(--boot-under); margin: 0 auto; padding: 4px 12px;
        width: fit-content; max-width: min(26em, calc(100% - 2 * var(--edge, 24px))); text-wrap: balance; text-align: center;
        border-radius: 8px; opacity: 0; transition: opacity 0.6s ease;
      }
      /* Calm at rest: it fades in, then breathes slowly, two of the point's breaths to one of its. */
      .tap-gate.is-shown .tap-gate-line { opacity: 1; animation: tap-gate-pulse 3.6s ease-in-out 0.6s infinite; }
      .tap-gate.is-leaving .tap-gate-line { opacity: 0; animation: none; transition: opacity 0.25s ease; }
      /* Focus is put on it for the keyboard, but the ring shows only once Tab is used: WebKit counts
         that first, programmatic focus as visible and drew a ring round the line at rest. */
      .tap-gate.is-keyed:focus-visible .tap-gate-line { outline: 2px solid #b6b6b6; outline-offset: 4px; }
      @keyframes tap-gate-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
      @media (prefers-reduced-motion: reduce) { .tap-gate.is-shown .tap-gate-line { animation: none; } }
      /* While the opening plays, the lobby's own controls (hint, links, settings gear and
         version, update banner) wait; they fade in as it settles.
         The galaxy sets data-opening (src/ui/galaxy/Galaxy.ts); a skip clears it at once. */
      html[data-opening="playing"] :is(.galaxy-hint, .galaxy-links, .lobby-gear-dock, .lobby-version-dock, .update-banner) { opacity: 0; visibility: hidden; }
      html[data-opening="settling"] :is(.galaxy-hint, .galaxy-links, .lobby-gear-dock, .lobby-version-dock, .update-banner) { transition: opacity 0.5s ease; }
      /* The planets' plates come in as the opening settles: faded in where they stand, slowly. */
      html .mira-shell .galaxy-label.is-unrevealed { opacity: 0; pointer-events: none; }
      html[data-opening] .mira-shell button.galaxy-label { transition: opacity 0.45s ease; }
    </style>
    <script>
      // Never select, part 2. Some engines start a selection or a drag in spite of the
      // styles above (a double tap on a label, a press that began over text inside a canvas
      // overlay). Stop both at the source, and drop any selection that still appears, unless
      // the player is working in a field.
      (function() {
        var editable = function(node) {
          var el = node && node.nodeType === 1 ? node : node && node.parentElement;
          return !!(el && el.closest && el.closest('input, textarea, [contenteditable]'));
        };
        document.addEventListener('selectstart', function(event) { if (!editable(event.target)) event.preventDefault(); }, { passive: false });
        document.addEventListener('dragstart', function(event) { if (!editable(event.target)) event.preventDefault(); }, { passive: false });
        document.addEventListener('selectionchange', function() {
          var selection = window.getSelection && window.getSelection();
          if (!selection || selection.isCollapsed) return;
          if (editable(selection.anchorNode) || editable(document.activeElement)) return;
          selection.removeAllRanges();
        });
      })();
      // Never zoom, part 3. Safari ignores user-scalable=no for pinches, so stop them where
      // they start: its own gesture events, any two-finger move, and a double tap. If the
      // page is ever found zoomed all the same (a field was focused, the device was turned),
      // put it back by restating the viewport, which makes Safari reset its scale.
      (function() {
        var stop = function(event) { event.preventDefault(); };
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(type) { document.addEventListener(type, stop, { passive: false }); });
        document.addEventListener('touchmove', function(event) { if (event.touches.length > 1) event.preventDefault(); }, { passive: false });
        document.addEventListener('dblclick', stop, { passive: false });
        var view = window.visualViewport, meta = document.querySelector('meta[name="viewport"]');
        if (!view || !meta) return;
        var content = meta.getAttribute('content'), timer = 0;
        var restore = function() {
          if (view.scale <= 1.01) return;
          var field = document.activeElement;
          if (field && /^(INPUT|TEXTAREA|SELECT)$/.test(field.tagName)) return;   // let them finish typing
          meta.setAttribute('content', content + ', initial-scale=1.0001');
          setTimeout(function() { meta.setAttribute('content', content); }, 60);
        };
        var later = function() { clearTimeout(timer); timer = setTimeout(restore, 250); };
        view.addEventListener('resize', later);
        document.addEventListener('focusout', later);
        window.addEventListener('orientationchange', later);
      })();
    </script>
    <script>
      // The loading veil's bootstrap, verbatim from terranlabs.com's layout: mark the
      // document as loading and ease --boot-progress toward a target on every frame, from
      // the first paint. src/ui/LoadingScreen.ts raises the target and lifts the veil.
      (function() {
        try {
          var root = document.documentElement;
          // Shows the loading veil; LoadingScreen lifts it.
          root.dataset.boot = "loading";
          // A page opened by a move between rooms (src/ui/parallelUniverse.ts): hold the veil from the
          // very first paint, and keep its status line hidden until the move's own line is in it,
          // so the markup's general loading line is never what shows (the body's veil script says
          // the line, removes data-move-unsaid and owns the release).
          try {
            var move = JSON.parse(sessionStorage.getItem("mira.roomMove") || "null");
            if (move && /^(full|chosen|returning|still-full)$/.test(move.reason) && Date.now() - move.at < 120000) { root.dataset.roomMove = ""; root.dataset.moveUnsaid = ""; }
          } catch (error) {}
          // ?intro=1 to 3: the continuous opening (src/ui/galaxy/opening.ts). The veil is black
          // space with a point of light where the lobby's sun will be. Not with reduced motion.
          // On unless ?intro=0. With reduced motion the veil is the same; only the reveal is plain.
          var intro = /[?&]intro=([0-2])/.exec(location.search);
          if (!intro || intro[1] !== "0") root.dataset.intro = intro ? intro[1] : "2";
          // The veil's progress: one number from 0 to 1, drawn by the mark (--boot-progress) and
          // the bar (--boot-bar, index.html's body). It goes through named stages, each ending at
          // its share of the bar; the shares are measured (the boot progress report of 25 November
          // 2026, cold and cached, desktop and a throttled phone) and kept in this one table.
          //   download   the startup files' bytes received, of the total the build counted
          //              (window.__miraBootSet, tools/boot-bytes.mjs)
          //   engine     the physics engine and the renderer started (phase "world")
          //   world      the first world built (phase "terrain")
          //   graphics   the first frame drawn (phase "ready")
          //   ready      the veil lifts (LoadingScreen.finish sets 1)
          // A later stage that takes long creeps toward its end but never reaches it, so a slow load
          // never shows a frozen bar and never claims a stage it has not finished. The number only
          // ever goes up, and stays just short of 1 until the veil lifts.
          // Measured 25 November 2026 (Slow 4G; the phone also at 4x CPU), share of the load's time:
          //               download  engine  world  graphics
          //   phone cold     84%      0%      2%     13%
          //   desktop cold   96%      0%      1%      3%
          //   phone cached   37%      0%     10%     52%
          // A fast load is over before the bar shows (desktop, cold or cached: 2.4 s). The bar shows
          // slow loads, nearly all of them cold, so the download has most of it; graphics, the longest
          // of the rest and the one a cached phone sees, the next most.
          var ENDS = [0.8, 0.82, 0.86, 0.97], AT = { world: 1, terrain: 2, ready: 3 };
          var set = window.__miraBootSet, total = set && set.bytes > 0 ? set.bytes : 0, files = total ? set.files : [];
          // Bytes received of the startup set: the document, and each listed file's body as
          // delivered (decoded), the largest seen per file, so a retried download is never counted
          // twice. The physics engine also counts as it streams, on its way to the loader.
          var received = function() {
            var bytes = 0, best = {}, engine = window.__miraPhysicsUrl || "", streamed = window.__miraPhysicsBytes || 0;
            try {
              performance.getEntriesByType("navigation").forEach(function(e) { bytes = Math.max(bytes, e.decodedBodySize || e.encodedBodySize || 0); });
              performance.getEntriesByType("resource").forEach(function(e) {
                var path = e.name.split(/[?#]/)[0], name = path.slice(path.lastIndexOf("/") + 1), n = e.decodedBodySize || e.encodedBodySize || 0;
                if (files.indexOf(name) >= 0 && !(n <= best[name])) best[name] = n;
              });
            } catch (error) {}
            var engineName = engine.slice(engine.lastIndexOf("/") + 1);
            if (engineName && files.indexOf(engineName) >= 0 && !(streamed <= best[engineName])) best[engineName] = streamed;
            for (var k in best) bytes += best[k];
            return bytes;
          };
          var shown = 0, target = 0, stage = 0, running = true, sampled = -1e9, still = matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (total) root.dataset.bootBytes = "";
          if (/[?&]bootpct=1/.test(location.search)) root.dataset.bootPercent = "";
          window.__boot = {
            // LoadingScreen.finish: 1, the veil is lifting.
            set: function(value) { if (value > target) target = value; },
            // A phase the game reports (core/quality.ts reportLoading): its stage is done.
            stage: function(phase) { var at = AT[phase]; if (at + 1 > stage) { stage = at + 1; if (ENDS[at] > target) target = ENDS[at]; } },
            value: function() { return shown; },
            stop: function() { running = false; },
            received: received,
            total: total
          };
          // Easing and creep go by time, not by frames: while the game builds its world and
          // compiles its shaders a busy phone draws a frame every second or so, and the bar must
          // catch up on the next one rather than fall behind (Slow 4G at 4x CPU, 25 November 2026).
          var prev = 0;
          (function tick(now) {
            if (!running) return;
            now = now || performance.now();
            var dt = prev ? Math.min(5000, Math.max(0, now - prev)) : 16; prev = now;
            // The download's own fraction, read four times a second.
            if (total && stage === 0 && !(now - sampled < 250)) { sampled = now; var part = ENDS[0] * Math.min(1, received() / total); if (part > target) target = part; }
            // Stages with nothing to measure creep; the download has its bytes (without a total, as
            // on the dev server and in builds from before it, it creeps too).
            var ceiling = (stage < ENDS.length ? ENDS[stage] : 1) - 0.015;
            if (target < ceiling && !(total && stage === 0)) target += (ceiling - target) * (1 - Math.exp(-dt / 4000));
            shown += (target - shown) * (1 - Math.exp(-dt / 230));
            root.style.setProperty("--boot-progress", shown.toFixed(4));
            // With reduced motion the bar moves in steps of a twentieth.
            root.style.setProperty("--boot-bar", (still ? Math.floor(shown * 20) / 20 : shown).toFixed(4));
            requestAnimationFrame(tick);
          })();
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div class="boot-veil">
      <!-- Mira's additions to the veil: its name, a word of status and, after a while, a
           line saying it is still working. A slow first visit must never look like a blank
           page. The path is the wordmark from src/ui/brand/wordmarkPath.ts. -->
      <div class="boot-point" aria-hidden="true"></div>
      <div class="boot-pulse" aria-hidden="true"></div>
      <svg class="boot-mark" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="boot-orbit" cx="60" cy="60" r="54" />
        <g class="boot-moon">
          <circle cx="60" cy="6" r="1.6" />
        </g>
        <circle class="boot-ring" cx="60" cy="60" r="34" />
        <circle class="boot-arc" cx="60" cy="60" r="34" pathLength="100" />
        <g class="boot-sun">
          <circle cx="60" cy="26" r="2.8" />
        </g>
      </svg>
      <p class="boot-status" aria-hidden="true">Checking which way is down.</p>
      <p class="boot-still" aria-hidden="true"></p>
      <script>
        // One fun line per load, chosen now and kept until loading ends; the markup above is the
        // no-script fallback. These lines are also in src/ui/data/loadingMessages.ts.
        // Still loading three seconds after the visit began, the fun line and under it a quiet
        // progress line fade in together. The progress line is two measured numbers and nothing
        // else: the seconds since the visit began, and the megabytes the page has received. The
        // startup code ships in several files (vite.config.ts), counted as each finishes, and
        // the physics engine, the largest file, is counted as it streams in.
        (function(s, w, a) {
          a = ["Checking which way is down.", "Counting wheels. Recounting wheels.", "Asking gravity to hold this for a moment.", "Tightening the imaginary bolts.", "Packing a spare atmosphere.", "Confirming that the sky is attached.", "Giving the moon some personal space.", "Moving the mountain slightly to the left.", "Reminding every object that it has mass.", "Setting gravity to roughly one gravity."];
          if (!s || !w) return;
          s.textContent = a[Math.floor(Math.random() * a.length)];
          // A page opened by a move between rooms (src/ui/parallelUniverse.ts moveVeilLine, the same
          // words): say what is happening, and hold the veil, from the first paint, not from when the
          // game's script arrives. The game reads and clears the note itself.
          try {
            var move = JSON.parse(sessionStorage.getItem("mira.roomMove") || "null");
            if (move && typeof move.reason === "string" && Date.now() - move.at < 120000) {
              var main = /^(lobby|public-[a-z0-9]+)$/.test(String(move.asked));
              var line = { full: "This world is full. Opening a parallel universe of it.", chosen: "Opening a parallel universe of this planet.",
                returning: main ? "Trying the main world." : "Trying that world again.",
                "still-full": main ? "The main world is still full. Back to your parallel universe." : "That world is still full. Back to your parallel universe." }[move.reason];
              if (line) {
                var root = document.documentElement, since = Date.now();
                s.textContent = line; root.dataset.roomMove = ""; root.dataset.bootLate = ""; delete root.dataset.moveUnsaid;
                // What sets the hold owns its end, whether or not the game's script ever arrives or
                // still finds the note fresh: the hold goes the moment the game is on screen or the
                // page's failure shows; after 45 s the line says so plainly and offers a reload.
                var watch = setInterval(function () {
                  var shell = document.querySelector(".mira-shell"), fatal = document.getElementById("fatal");
                  var playing = shell && shell.classList.contains("is-playing") && !shell.classList.contains("is-descending") && root.dataset.boot !== "ready";
                  if (playing || (fatal && fatal.style.display && fatal.style.display !== "none")) { delete root.dataset.roomMove; clearInterval(watch); return; }
                  if (Date.now() - since > 45000 && !document.getElementById("move-reload")) {
                    s.textContent = "This is taking a while.";
                    var reload = document.createElement("button");
                    reload.id = "move-reload"; reload.type = "button"; reload.className = "boot-retry"; reload.textContent = "Reload";
                    reload.addEventListener("click", function () { location.reload(); });
                    s.parentNode.appendChild(reload);
                  }
                }, 200);
              }
            }
          } catch (error) {}
          var root = document.documentElement;
          // Without a startup total, bytes received: every finished file's body (the document included), and the physics
          // engine's file as it streams in, counted on its way to the loader (tools/rapier-wasm.mjs)
          // until it finishes and its own entry takes over. Bodies as delivered (decoded), the same
          // measure for both, so the count only ever goes up.
          var received = function() {
            var bytes = 0, engine = window.__miraPhysicsUrl, engineDone = false;
            try {
              performance.getEntriesByType("navigation").concat(performance.getEntriesByType("resource")).forEach(function(e) {
                bytes += e.decodedBodySize || e.encodedBodySize || e.transferSize || 0;
                if (engine && e.name.indexOf(engine) >= 0) engineDone = true;
              });
            } catch (error) {}
            if (!engineDone) bytes += window.__miraPhysicsBytes || 0;
            return bytes;
          };
          // With the build's startup total (window.__miraBootSet) the line is the progress bar
          // (the head's bootstrap moves it); the seconds and megabytes stay as its title, for
          // anyone diagnosing a slow load. Without one (the dev server) it is the numbers, as before.
          var boot = window.__boot, bar = !!(boot && boot.total), pct = null;
          if (bar) {
            w.textContent = "";
            var track = document.createElement("span"); track.className = "boot-bar"; w.appendChild(track);
            pct = document.createElement("span"); pct.className = "boot-pct"; w.appendChild(pct);
          }
          var draw = function() {
            if (root.dataset.boot === "done") { clearInterval(tick); return; }
            // Seconds since the visit began (performance.now counts from the navigation).
            var now = performance.now();
            var numbers = Math.floor(now / 1000) + " s \u00b7 " + ((bar ? boot.received() : received()) / 1048576).toFixed(1) + " MB";
            if (bar) { w.title = numbers; w.dataset.numbers = numbers; pct.textContent = Math.floor(boot.value() * 100) + "%"; }
            else w.textContent = numbers;
            // The one trigger for both lines (the CSS above): three seconds into the visit.
            if (now >= 3000) root.dataset.bootLate = "";
          };
          var tick = setInterval(draw, 250);
        })(document.querySelector(".boot-status"), document.querySelector(".boot-still"));
      </script>
    </div>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="fatal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
