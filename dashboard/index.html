<!doctype html>
<html lang="en" data-theme="ember">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Syn3h build dashboard</title>
<link rel="icon" href="assets/terran-labs-logo.png" />
<style>
  @font-face { font-family: "Barlow"; font-weight: 400; src: url(assets/fonts/barlow-400-latin.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: "Barlow"; font-weight: 600; src: url(assets/fonts/barlow-600-latin.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: "Barlow Condensed"; font-weight: 300; src: url(assets/fonts/barlow-condensed-300-latin.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: "Barlow Condensed"; font-weight: 500; src: url(assets/fonts/barlow-condensed-500-latin.woff2) format("woff2"); font-display: swap; }

  /* Ember: the red theme from terranlabs.com (site-space and atmosphere gradients). */
  :root {
    --space: #0a0302; --ink: #fbeee6; --ink-2: #d9b9a6; --ink-3: #9a7a68;
    --accent: 255 110 40; --accent-2: 255 60 30; --line: rgb(255 150 100 / 0.16);
    --ok: 120 220 150; --run: 255 190 80; --wait: 150 130 120; --bad: 255 80 70;
  }
  * { box-sizing: border-box; }
  html { background: var(--space); }
  body { margin: 0; min-height: 100vh; color: var(--ink); font: 400 15px/1.55 "Barlow", system-ui, sans-serif;
    background-color: var(--space);
    background-image:
      radial-gradient(ellipse 95% 60% at 50% 0%, rgb(255 110 40 / 0.28), rgb(255 110 40 / 0.09) 45%, transparent 75%),
      radial-gradient(ellipse 60% 45% at 0% 60%, rgb(180 60 20 / 0.1), transparent 70%),
      radial-gradient(1.5px 1.5px at 22% 64%, rgb(255 170 90 / 0.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 79% 27%, rgb(255 200 140 / 0.3) 50%, transparent 51%),
      radial-gradient(1px 1px at 41% 12%, rgb(255 220 180 / 0.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 63% 81%, rgb(255 200 140 / 0.25) 50%, transparent 51%);
    background-attachment: fixed; }
  /* Slow orbiting embers, after the site's tl-orbit effect. */
  .orbit { position: fixed; inset: -20vmax; pointer-events: none; z-index: 0; opacity: .55;
    background: radial-gradient(circle at 30% 30%, rgb(255 90 30 / .10), transparent 28%), radial-gradient(circle at 72% 64%, rgb(255 160 60 / .07), transparent 26%);
    animation: orbit 90s linear infinite; }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .orbit { animation: none; } }

  .wrap { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 28px 22px 80px; }
  header { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 26px; }
  header img.tl { height: 54px; width: 54px; }
  header img.syn { height: 54px; }
  header .titles { flex: 1; min-width: 220px; }
  h1 { font: 300 clamp(30px, 5vw, 52px)/1 "Barlow Condensed", sans-serif; letter-spacing: .04em; text-transform: uppercase; margin: 0; }
  h1 b { font-weight: 500; color: rgb(var(--accent)); }
  .sub { color: var(--ink-2); margin-top: 6px; }
  .live { font: 500 13px "Barlow Condensed"; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); text-align: right; }
  .live i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--ok)); margin-right: 6px; box-shadow: 0 0 10px rgb(var(--ok)); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  h2 { font: 500 15px "Barlow Condensed", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: rgb(var(--accent)); margin: 0 0 12px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
  .card { grid-column: span 12; border-radius: 18px; padding: 18px 20px; border: 1px solid var(--line);
    background: linear-gradient(180deg, rgb(255 255 255 / .07), rgb(255 255 255 / .025) 55%, rgb(255 255 255 / .05));
    -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .12), 0 18px 50px rgb(0 0 0 / .35); }
  @media (min-width: 900px) { .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } }

  .headline { font: 300 clamp(20px, 2.6vw, 28px)/1.25 "Barlow Condensed"; letter-spacing: .01em; }
  .muted { color: var(--ink-3); font-size: 13px; }

  .row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .t { font-weight: 600; }
  .row .d { color: var(--ink-2); font-size: 14px; }
  .tag { flex: none; margin-top: 2px; font: 500 11px "Barlow Condensed"; letter-spacing: .14em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; border: 1px solid; min-width: 78px; text-align: center; }
  .done { color: rgb(var(--ok)); border-color: rgb(var(--ok) / .4); background: rgb(var(--ok) / .1); }
  .active { color: rgb(var(--run)); border-color: rgb(var(--run) / .45); background: rgb(var(--run) / .1); }
  .next, .waiting { color: rgb(var(--wait)); border-color: rgb(var(--wait) / .4); }
  .blocked { color: rgb(var(--bad)); border-color: rgb(var(--bad) / .5); background: rgb(var(--bad) / .1); }

  a { color: rgb(255 170 110); text-decoration: none; } a:hover { text-decoration: underline; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font: 500 12px "Barlow Condensed"; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); padding: 6px 8px; }
  td { padding: 7px 8px; border-top: 1px solid var(--line); vertical-align: top; }
  code, .mono { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: #ffd0b0; }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .tabs button { font: 500 13px "Barlow Condensed"; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); background: rgb(255 255 255 / .05); border: 1px solid var(--line); border-radius: 99px; padding: 7px 14px; cursor: pointer; }
  .tabs button.on { color: #1a0a04; background: rgb(var(--accent)); border-color: transparent; }
  .doc { max-height: 70vh; overflow: auto; padding-right: 8px; }
  .doc h1 { font-size: 30px; margin: 4px 0 14px; } .doc h2 { margin: 26px 0 10px; } .doc h3 { font: 600 16px "Barlow"; margin: 18px 0 6px; }
  .doc pre { background: rgb(0 0 0 / .35); padding: 12px; border-radius: 10px; overflow: auto; }
  .doc p, .doc li { color: var(--ink-2); } .doc strong { color: var(--ink); }
  .links { margin-bottom: 16px; }
  .links .g { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); }
  .links .g:first-child { border-top: 0; padding-top: 0; }
  .links .g h3 { flex: 0 0 100%; margin: 0; font: 500 13px "Barlow Condensed"; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
  .links .g h3 span { text-transform: none; letter-spacing: 0; color: var(--ink-3); font: 400 12.5px inherit; margin-left: 8px; }
  .links a { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: rgb(255 110 40 / .07); color: var(--ink); font-size: 13.5px; }
  .links a:hover { background: rgb(255 110 40 / .16); text-decoration: none; }

  /* Statistics: large number tiles, two across on a phone, five or six across on a wide screen. */
  .stats-card { margin-bottom: 16px; }
  .stats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  @media (min-width: 900px) { .stats { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); } }
  .tile { min-width: 0; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 10px; background: rgb(0 0 0 / .22); display: flex; flex-direction: column; gap: 2px; }
  .tile.wide { grid-column: span 2; }
  .tile .k { font: 500 12px "Barlow Condensed"; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .tile .v { font: 300 clamp(26px, 3vw, 36px)/1.05 "Barlow Condensed"; color: var(--ink); overflow-wrap: anywhere; }
  .tile .s { color: var(--ink-2); font-size: 13px; }
  .tile .w { margin-top: auto; padding-top: 6px; color: var(--ink-3); font-size: 11.5px; }
  .tile.stale .w { color: rgb(var(--run)); }
  .tile .parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 6px 12px; margin: 6px 0 2px; }
  .tile .parts b { display: block; font: 500 19px/1.1 "Barlow Condensed"; color: rgb(var(--accent)); }
  .tile .parts span { color: var(--ink-3); font-size: 12px; }
  /* Below about 356 px the grid is one column, where a two column span would add a phantom column. */
  @media (max-width: 355px) { .tile.wide { grid-column: auto; } }
  .rel .rl { display: flex; gap: 14px; margin-top: 3px; font-size: 13px; }
  #releases .row { border-top: 1px solid var(--line); }
  #headline { margin-bottom: 8px; }
  footer { margin-top: 30px; display: flex; gap: 18px; align-items: center; color: var(--ink-3); font-size: 13px; flex-wrap: wrap; }
  footer img { height: 34px; opacity: .85; }
</style>
</head>
<body>
<div class="orbit"></div>
<div class="wrap">
  <header>
    <img class="tl" src="assets/terran-labs-logo.png" alt="Terran Labs" />
    <div class="titles">
      <h1><b>Syn3h</b> build dashboard</h1>
      <div class="sub" id="tagline"></div>
    </div>
    <img class="syn" src="assets/syn3h-logo-sun-1024x512.png" alt="Syn3h" />
    <div class="live"><i></i><span id="updated">connecting</span><br /><span id="deadline"></span></div>
  </header>

  <section class="card links"><div id="links"></div></section>

  <section class="card stats-card">
    <h2>By the numbers</h2>
    <div class="stats" id="stats"></div>
    <div class="muted" id="statsNote"></div>
  </section>

  <div class="grid">
    <section class="card c7">
      <h2>Shipped today</h2>
      <div class="headline" id="headline"></div>
      <div id="releases"></div>
    </section>
    <section class="card c5">
      <h2>In progress</h2>
      <div id="inprogress"></div>
      <h2 style="margin-top:22px">Needs you</h2>
      <div id="decisions"></div>
      <h2 style="margin-top:22px">Known issues</h2>
      <div id="known"></div>
    </section>

    <section class="card">
      <h2>Recent commits</h2>
      <table><tbody id="commits"></tbody></table>
    </section>

    <section class="card">
      <h2>Documentation</h2>
      <div class="tabs" id="tabs"></div>
      <div class="doc" id="doc"></div>
    </section>
  </div>

  <footer>
    <img src="assets/terran-labs-wordmark.png" alt="Terran Labs" />
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const row = (state, title, detail) => `<div class="row"><span class="tag ${esc(state)}">${esc(state)}</span><div><div class="t">${esc(title)}</div><div class="d">${esc(detail)}</div></div></div>`
let currentDoc = null

// Numbers: full value on hover, short form on the tile.
const full = (n) => Number(n).toLocaleString('en-US')
function short(n) {
  if (n == null || !Number.isFinite(Number(n))) return '?'
  const a = Math.abs(n)
  for (const [d, u] of [[1e9, 'B'], [1e6, 'M'], [1e3, 'K']]) if (a >= d * (u === 'K' ? 10 : 1)) return (n / d).toFixed(n / d >= 100 ? 0 : n / d >= 10 ? 1 : 2) + ' ' + u
  return full(n)
}
const pacific = (iso) => iso ? new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' }).format(new Date(iso)) : 'unknown'

/** One tile: a label, a big number, and small lines under it. wide tiles span two columns. */
function tile(label, value, subs, { title = '', wide = false, stale = false, when = '' } = {}) {
  return `<div class="tile${wide ? ' wide' : ''}${stale ? ' stale' : ''}"><div class="k">${esc(label)}</div><div class="v" title="${esc(title)}">${esc(value)}</div>${subs.filter(Boolean).map((x) => `<div class="s">${esc(x)}</div>`).join('')}<div class="w">${esc(when)}${stale ? ' · stale' : ''}</div></div>`
}
function split(label, parts, opts) {
  const total = parts.reduce((a, [, n]) => a + (n ?? 0), 0)
  return `<div class="tile wide${opts.stale ? ' stale' : ''}"><div class="k">${esc(label)}</div><div class="v" title="${esc(full(total))}">${esc(short(total))}</div><div class="parts">${parts.map(([k, n]) => `<div><b title="${esc(full(n ?? 0))}">${esc(short(n ?? 0))}</b><span>${esc(k)}</span></div>`).join('')}</div>${opts.note ? `<div class="s">${esc(opts.note)}</div>` : ''}<div class="w">${esc(opts.when)}${opts.stale ? ' · stale' : ''}</div></div>`
}

function renderStats(st) {
  if (!st) { $('stats').innerHTML = '<div class="muted">No statistics yet. Run tools/dashboard-stats.mjs.</div>'; return }
  const when = 'as of ' + pacific(st.generatedAt)
  const tk = st.tokens, pr = st.price, c = st.commits, r = st.releases, code = st.code, p = st.pullRequests
  const tw = tk ? 'counted ' + pacific(tk.countedAt) : when
  const out = [
    tile('Newest release', r.newest ?? '?', [r.newestAt ? 'released ' + r.newestAt : ''], { wide: true, when }),
    tile('Releases shipped', full(r.production), [`${r.today} today`, r.withdrawn ? `${r.withdrawn} withdrawn` : ''], { when }),
    tile('Commits on main', short(c.total), [`${full(c.last48h)} in the last 48 hours`], { title: full(c.total), when }),
    // Lanes merge their branches into main directly, so merges say more than pull requests.
    p.count ? tile('Pull requests', full(p.count), [`${full(p.mergedDirectly)} branches merged directly`], { when })
      : tile('Branches merged directly', full(c.merges), [p.count === 0 ? 'no pull requests: lanes merge straight to main' : 'pull requests not counted'], { when }),
    tile('Lines of TypeScript', short(code.lines), [`${full(code.sourceFiles)} source files`], { title: full(code.lines), when }),
    tile('Test files', full(code.testFiles), [], { when }),
    tile('Tunable parameters', full(code.params), ['declared with defineParam'], { when }),
  ]
  if (tk) {
    out.push(
      tile('Tokens used', short(tk.total), [`Claude ${short(tk.claude.total)} · Codex ${short(tk.codex.total)}`], { title: full(tk.total), stale: tk.stale, when: tw }),
      tile('Consumption rate', short(tk.perHour) + ' / h', [`over ${tk.hours} hours since the first session`], { title: full(tk.perHour) + ' tokens per hour', stale: tk.stale, when: tw }),
      split('Claude tokens', [['cache reads', tk.claude.cacheRead], ['cache writes', tk.claude.cacheWrite], ['uncached input', tk.claude.input], ['output', tk.claude.output]], { stale: tk.stale, when: tw, note: `${full(tk.claude.sessions)} session logs` }),
      split('Codex tokens', [['cache reads', tk.codex.cacheRead], ['cache writes', tk.codex.cacheWrite], ['uncached input', tk.codex.input], ['output', tk.codex.output]], { stale: tk.stale, when: tw, note: `${full(tk.codex.sessions)} sessions · not priced` }),
    )
  }
  if (pr) out.push(tile('Estimated list price, Claude', `$${full(pr.low)} to $${full(pr.high)}`, [pr.note], { wide: true, stale: tk?.stale, when: tw }))
  $('stats').innerHTML = out.join('')
  $('statsNote').textContent = pr ? `Rates per million tokens, ${pr.ratesDate}: ` + pr.rates.map((x) => `${x.model} input $${x.input.toFixed(2)}, output $${x.output.toFixed(2)}, cache read $${x.cacheRead.toFixed(2)}, cache write $${x.cacheWriteLow.toFixed(2)} to $${x.cacheWriteHigh.toFixed(2)}`).join('; ') + '.' : ''
}

async function refresh() {
  try {
    const s = await (await fetch('api/status', { cache: 'no-store' })).json()
    $('tagline').textContent = s.tagline ?? ''
    $('updated').textContent = 'live, ' + new Date(s.now).toLocaleTimeString()
    $('deadline').textContent = s.updated ? 'status ' + s.updated : ''
    renderStats(s.stats)
    const rel = s.releases ?? []
    const live = rel.find((r) => r.channel === 'production')
    $('headline').textContent = live ? `${live.version} is live at www.syn3h.com, released ${live.time}. ${rel.filter((r) => r.channel === 'production').length} public releases from ${rel.at(-1)?.version} on.` : ''
    $('releases').innerHTML = rel.map((r) => `<div class="row rel"><span class="tag ${r.channel === 'production' ? (r === live ? 'active' : 'done') : 'blocked'}">${esc(r === live ? 'live' : r.channel === 'production' ? 'shipped' : r.channel)}</span><div><div class="t">${esc(r.version)} <span class="muted">${esc(r.time.replace(/^\d{4}-\d\d-\d\d /, ''))}</span></div><div class="d">${esc(r.line)}</div><div class="rl"><a href="${esc(r.notes)}" target="_blank" rel="noopener">Notes</a>${r.frozen ? `<a href="${esc(r.frozen)}" target="_blank" rel="noopener">Play this build</a>` : ''}</div></div></div>`).join('') || '<div class="muted">No releases recorded.</div>'
    $('inprogress').innerHTML = (s.inProgress ?? []).map((w) => row(w.state, w.title, w.detail)).join('') || '<div class="muted">Nothing recorded.</div>'
    $('decisions').innerHTML = (s.decisions ?? []).map((d) => row(d.state ?? 'waiting', d.title, d.detail)).join('') || '<div class="muted">Nothing right now.</div>'
    $('known').innerHTML = (s.knownIssues ?? []).map((k) => `<div class="row"><div><div class="t">${esc(k.title)}</div><div class="d">${esc(k.detail)}</div></div></div>`).join('') || '<div class="muted">None recorded.</div>'
    // A link that does not answer is hidden, and so is a group left empty.
    $('links').innerHTML = (s.links ?? []).map((g) => ({ ...g, items: g.items.filter((i) => i.up !== false) })).filter((g) => g.items.length)
      .map((g) => `<div class="g"><h3>${esc(g.group)}<span>${esc(g.note ?? '')}</span></h3>${g.items.map((i) => `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>`).join('')}</div>`).join('')
    $('commits').innerHTML = (s.git?.commits ?? []).map((c) => `<tr><td class="mono">${esc(c.hash)}</td><td>${esc(c.subject)}<div class="muted">${esc(c.when)}${c.refs ? ' · ' + esc(c.refs) : ''}</div></td></tr>`).join('')
    if (!$('tabs').children.length) {
      $('tabs').innerHTML = (s.docs ?? []).map((d) => `<button data-id="${esc(d.id)}">${esc(d.title)}</button>`).join('')
      $('tabs').onclick = (e) => { if (e.target.dataset.id) loadDoc(e.target.dataset.id) }
      if (s.docs?.length) loadDoc(s.docs[0].id)
    }
  } catch (e) { $('updated').textContent = 'offline, retrying' }
}
async function loadDoc(id) {
  currentDoc = id
  for (const b of $('tabs').children) b.classList.toggle('on', b.dataset.id === id)
  $('doc').innerHTML = await (await fetch('api/doc/' + id, { cache: 'no-store' })).text()
  $('doc').scrollTop = 0
}
refresh(); setInterval(refresh, 5000)
</script>
</body>
</html>
