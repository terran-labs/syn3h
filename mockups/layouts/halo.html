<!doctype html>
<!-- Halo: everything gathers close around the speed and height crescents, as if they were the
     rim of one circle: tag status above it, vehicle below it, the gear crescent concentric on the
     left. Freeing the cursor opens the settings as a lens-shaped sheet inside the halo, bracketed by
     the two crescents. -->
<meta charset="utf-8"><title>Syn3h HUD: Halo</title>
<link rel="stylesheet" href="shared.css">
<body>
<script type="module">
import * as H from './shared.js'
const { LOCKED, FREE, PAUSED, DEVICE, VW, VH } = H
const cx = VW / 2, cy = VH / 2

function desktop() {
  const sheet = FREE ? `<div class="panel-out" style="left:${cx - 184}px;top:${cy - 300}px;width:368px;height:600px">${H.outline(368, 600, 20, { left: 12, right: 12 })}
    <div class="inner" style="padding:18px 22px">${H.vehicleSwitch('justify-content:space-between', true)}${H.searchRow()}<div>${H.settingRows(H.SETTINGS.filter(([t]) => t !== 'Vehicles'))}</div><div style="flex:1"></div>${H.footRow(true)}</div></div>` : ''
  return `${H.nameTags()}${H.desktopBase({ freeHintAt: FREE ? 'none' : 'centre' })}
  ${H.tagStatus(`left:${cx}px;top:${FREE ? cy - 336 : cy - 262}px;transform:translate(-50%,-50%)`)}
  ${FREE ? H.freeHint(`left:${cx}px;top:${cy + 330}px;transform:translateX(-50%)`) : H.vehicleSwitch(`left:${cx}px;top:${cy + 262}px;transform:translate(-50%,-50%)`)}
  ${LOCKED ? H.escHint(`left:${cx}px;top:${cy + 306}px;transform:translate(-50%,-50%)`) : ''}
  ${sheet}
  ${H.banner('left:50%;bottom:20px;transform:translateX(-50%)')}
  ${H.toast('right:20px;top:20px')}
  ${PAUSED ? H.pauseCard() : ''}`
}

function phone() {
  const port = DEVICE === 'portrait'
  return H.nameTags() + H.phone({
    status: H.tagStatus(port ? 'left:50%;top:214px;transform:translateX(-50%)' : 'left:50%;top:24px;transform:translateX(-50%)'),
    toastAt: port ? 'left:12px;top:52px' : 'left:44px;top:12px',
    sheet: 'centre',
  })
}
H.mount('halo', () => DEVICE === 'desktop' ? desktop() : phone())
</script>
