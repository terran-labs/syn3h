<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"/><title>Mira logo lab</title><style>
html,body{margin:0;background:#03060b;color:#e6ecff;font:15px/1.45 system-ui,-apple-system,sans-serif}
header{padding:22px 20px 6px;max-width:1240px;margin:0 auto}
header h1{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:.02em}
header p{margin:0;color:#a9b6d6;max-width:70ch}
#sheet{display:grid;gap:22px;padding:18px 20px 60px;max-width:1240px;margin:0 auto}
.card{background:#0a0f1c;border:1px solid #1a2440;border-radius:18px;padding:16px;overflow:hidden}
.card h2{margin:0 0 4px;font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px}
.card .n{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:15px;background:#e9eefc;color:#0a0f1c;font-size:15px;font-weight:700}
.card>p{margin:0 0 12px;color:#a9b6d6}
.hero{display:block;width:100%;height:auto;border-radius:12px}
.row{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;align-items:flex-end}
figure{margin:0;display:flex;flex-direction:column;gap:6px}
figcaption{font-size:12px;color:#8d9abb}
.white{width:300px;max-width:100%;height:auto;border-radius:10px;display:block}
.app{width:120px;height:120px;border-radius:27px;display:block}
.favs .actual{display:flex;gap:10px;align-items:center}
.favs .zoom{display:flex;gap:10px;align-items:flex-end}
.fav{image-rendering:pixelated;border:1px solid #1d2742;border-radius:4px}
.tag{font-size:12px;font-weight:500;color:#c9b48f;background:#1d1a14;border:1px solid #3d3322;border-radius:999px;padding:3px 10px;margin-left:4px}
.library{grid-column:1/-1}.ms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.ms svg{width:100%;height:110px;background:#060a14;border-radius:10px}.ms figcaption{font-size:12px;line-height:1.35}
header a{color:#c9d6ff}
.links{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.links a{padding:8px 16px;border-radius:999px;background:#18203a;border:1px solid #2c3a63;color:#e6ecff;text-decoration:none;font-size:14px}
@media (min-width:1000px){#sheet{grid-template-columns:1fr 1fr}}
@media (max-width:480px){#sheet{padding:12px 10px 40px;gap:14px}.card{padding:12px;border-radius:14px}.white{width:100%}}
</style></head><body><header><h1>Mira logo</h1><p></p></header><div id="sheet"></div><script type="module" src="/src/ui/brand/mira/miraLab.ts"></script></body></html>
